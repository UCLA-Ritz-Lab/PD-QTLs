# ──────────────────────────────────────────────────────────────────────────────
# PEG mQTL Pipeline Configuration
# PEG methylation + genotypes → stratified mQTLs → meta-analysis
# ──────────────────────────────────────────────────────────────────────────────

# ── Input data paths (relative to pipeline directory) ─────────────────────────
data:
  meth_peg1:        "../PEG_450K/datMethPEG1t.RData"
  meth_peg2:        "../PEG_450K/datMethPEG2t.RData"
  sentrix_map_peg1: "../PEG_450K/sample_sentrix_mapping_peg1.csv"
  sentrix_map_peg2: "../PEG_450K/sample_sentrix_mapping_peg2.csv"
  covar_peg1:       "../PEG_covariates/covariates_peg1.csv"
  covar_peg2:       "../PEG_covariates/covariates_peg2.csv"
  gwas_linkage:     "../PEG_WGS/gwas_linkage.csv"
  vcf:              "../PEG_WGS/PEG_PD.phased.vcf.gz"

# Output directory
out_dir: "results"

# ── Datasets to process ────────────────────────────────────────────────────────
# Each entry defines a stratified analysis unit.
# case_group: used in meta-analysis grouping (cases or controls)
datasets:
  peg1_cases:
    label:      "PEG1 Cases"
    wave:       "PEG1"
    case_group: "cases"
  peg1_controls:
    label:      "PEG1 Controls"
    wave:       "PEG1"
    case_group: "controls"
  peg2_cases:
    label:      "PEG2 Cases"
    wave:       "PEG2"
    case_group: "cases"

# Meta-analysis is handled in a separate pipeline (peg_ppmi_meta/)
# that combines results from this pipeline and the PPMI mQTL pipeline.

# ── Probe filtering ────────────────────────────────────────────────────────────
filters:
  min_sd:           0.02    # minimum SD across samples to retain probe
  max_na_fraction:  0.00    # maximum NA fraction per probe (0 = complete cases)

# ── MatrixEQTL settings ────────────────────────────────────────────────────────
matrixeqtl:
  cis_dist:         1000000  # cis window in bp (1 Mb)
  pval_cis:         1e-3     # p-value threshold for cis output
  pval_trans:       1e-5     # p-value threshold for trans output
  model:            "linear" # linear or anova

# ── PLINK2 QC filters for genotype subsetting ─────────────────────────────────
plink:
  maf:   0.01
  geno:  0.05
  mind:  0.10
  hwe:   1e-6

# ── Compute resources ──────────────────────────────────────────────────────────
resources:
  threads_r:     1
  threads_plink: 1
