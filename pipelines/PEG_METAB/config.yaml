# ──────────────────────────────────────────────────────────────────────────────
# PEG metQTL Pipeline Configuration
# PEG C18 + HILIC untargeted metabolomics + imputed genotypes -> metQTLs
# ──────────────────────────────────────────────────────────────────────────────

# ── Input data paths (relative to pipeline directory) ─────────────────────────
data:
  c18_rdata:    "../../Downloads/PEG_METAB/PEG_c18_quant_combat_LOD_cc.t.RData"
  c18_keyvar:   "../../Downloads/PEG_METAB/c18_keyVar_link_cc.RData"
  hilic_rdata:  "../../Downloads/PEG_METAB/PEG_hilic_quant_combat_PC_LOD_cc.t.RData"
  hilic_keyvar: "../../Downloads/PEG_METAB/hilic_keyVar_link_cc.RData"
  covar_peg1:   "../../Downloads/PEG_covariates/covariates_peg1.csv"
  covar_peg2:   "../../Downloads/PEG_covariates/covariates_peg2.csv"
  vcf:          "../../results/PEG_WGS/post_imputed/peg_imputed_filtered.dose.vcf.gz"
  gwas_linkage: "../../Downloads/PEG_WGS/gwas_linkage.csv"
  # 1000G-anchored ancestry PCs (ANCESTRY_REF pipeline output).
  # Keyed by IID = GWAS_ID (CRG_*/CRG2_*), joined to pegid through
  # gwas_linkage.csv with DUP=0.
  ancestry_pcs: "../../results/ANCESTRY_REF/covariates/ancestry_pcs_PEG.csv"

# Output directory
out_dir: "../../results/PEG_METAB"

# ── Metabolomics platforms ─────────────────────────────────────────────────────
platforms:
  - c18
  - hilic

# ── Datasets to process ───────────────────────────────────────────────────────
# Each entry is platform_wave_casegroup
datasets:
  c18_peg1_cases:
    platform:   "c18"
    wave:       1
    case_group: "cases"
  c18_peg1_controls:
    platform:   "c18"
    wave:       1
    case_group: "controls"
  c18_peg2_cases:
    platform:   "c18"
    wave:       2
    case_group: "cases"
  hilic_peg1_cases:
    platform:   "hilic"
    wave:       1
    case_group: "cases"
  hilic_peg1_controls:
    platform:   "hilic"
    wave:       1
    case_group: "controls"
  hilic_peg2_cases:
    platform:   "hilic"
    wave:       2
    case_group: "cases"

# ── Feature filtering ─────────────────────────────────────────────────────────
# ── Ancestry covariates ───────────────────────────────────────────
# Genetic ancestry PCs REPLACE the former self-reported Ethnicity dummy
# variables (Ethnicity_Hispanic/Asian/Black, ref=Caucasian). Self-report is a
# coarse proxy: in the PEG ancestry QC, 25 of 124 self-reported AMR samples sit
# nearest the EUR 1000G centroid, and a binary dummy cannot represent
# continuous admixture at all. 5 PCs matches PEG_MQTL and PPMI_MQTL so every
# cohort entering the meta-analysis uses the same ancestry model.
ancestry:
  n_pcs: 5

filters:
  min_sd:          0.01   # minimum SD across samples to retain feature
  max_na_fraction: 0.20   # max missingness per feature (LOD imputation already applied)

# ── MatrixEQTL settings ───────────────────────────────────────────────────────
matrixeqtl:
  cis_dist:    1000000  # cis window in bp (1 Mb)
  # Must be >= pval_trans. MatrixEQTL asserts
  #   pvOutputThreshold == 0 || pvOutputThreshold.cis == 0 ||
  #   pvOutputThreshold <= pvOutputThreshold.cis
  # and dies with a bare stopifnot() otherwise — which is what a cis of 1e-5
  # against a trans of 1e-2 produced.
  #
  # The value is otherwise inert here: extract_positions.R assigns every
  # metabolite feature chr=0/pos=0 (untargeted features have no genomic
  # position), so no SNP is ever within cisDist of a feature, every pair is
  # classified trans, and cis_metqtls.txt is always header-only. Kept equal to
  # pval_trans rather than set to 0 so MatrixEQTL still creates the cis file
  # that the Snakefile declares as an output.
  pval_cis:    1e-2     # cis output threshold — inert; see above
  # Liberal trans threshold on purpose. A strict threshold (1e-8) leaves ~3k
  # rows per dataset, few of which share a SNP with the longitudinal mQTL hit
  # list, so the mQTL x metQTL overlap comes back nearly empty. At 1e-2 the
  # output is a superset that keeps enough candidates for the overlap to be
  # informative; multiple-testing correction happens downstream, not here.
  pval_trans:  1e-2     # trans output threshold
  model:       "linear"
  # MatrixEQTL's FDR column is required downstream (the overlap report filters
  # on it). Computing it means holding every retained p-value in RAM, which is
  # why noFDRsaveMemory was once switched on; the cluster has the headroom, so
  # it stays off. See run_metqtl.R.
  gzip_output: true     # write .txt.gz — a 1e-2 trans pass runs to ~8.5 GB plain

# Row cap for downstream readers. The full 1e-2 trans output is far larger than
# R can hold, so consumers stream the gzip and keep the first N p-value-sorted
# rows. Previously this was a manual `head -10000000` on the cluster before
# transfer; capping at read time instead keeps the transferred file complete.
downstream:
  max_trans_rows: 10000000

# ── Imputation quality filter ─────────────────────────────────────────────────
imputation:
  min_r2:  0.8
  min_maf: 0.05

# ── PLINK2 QC filters ────────────────────────────────────────────────────────
plink:
  maf:   0.05
  geno:  0.05
  mind:  0.10
  hwe:   1e-6

# ── Compute resources ─────────────────────────────────────────────────────────
resources:
  threads_r:     1
  threads_plink: 1
