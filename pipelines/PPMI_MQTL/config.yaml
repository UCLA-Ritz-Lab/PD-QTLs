# ──────────────────────────────────────────────────────────────────────────────
# PPMI mQTL Pipeline Configuration
# PPMI methylation (EPIC v1) + WGS genotypes → stratified baseline mQTLs
# ──────────────────────────────────────────────────────────────────────────────

# ── Input data paths (relative to pipeline directory) ─────────────────────────
data:
  # Beta matrix from IDAT pipeline — columns named {SubjectID}_T{visit}
  beta_matrix:     "../../results/PPMI_GCP/local_results/final/beta_matrix.csv.gz"
  # Cell-type proportions from EpiDISH (IDAT pipeline output)
  cell_type_props: "../../results/PPMI_GCP/local_results/final/cell_type_proportions.csv"
  # PLINK2 genome-wide pfiles (WGS pipeline output) — prefix without extension
  plink_prefix:    "../../results/PPMI_WGS/post_imputed/ppmi_imputed"
  # PPMI participant status / phenotype file
  phenotype_file:  "../../Downloads/PPMI_covariates/Participant_Status_14Dec2025.csv"
  # 1000G-anchored ancestry PCs (ANCESTRY_REF pipeline output).
  # Keyed by IID = PPMISI{PATNO}, matching the imputed psam sample IDs.
  ancestry_pcs:    "../../results/ANCESTRY_REF/covariates/ancestry_pcs_PPMI.csv"

# Output directory
out_dir: "../../results/PPMI_MQTL"

# ── ID transformation rules ───────────────────────────────────────────────────
# Methylation columns:  {PATNO}_T{visit}    e.g. 10874_T1
# PLINK2 sample IDs:    PPMISI{PATNO}          e.g. PPMISI10874
#   (the pre-imputation WGS pfiles used PPMISI{PATNO}.variant2, where the
#    .variant2 suffix marked rows carrying actual genotype data; the imputation
#    server dropped both the suffix and the non-genotype rows, so all 894
#    samples in the imputed psam are real and no suffix filtering is needed)
#   (psam has proper #FID column so keep files use FID IID, not 0 IID)
# Phenotype file ID:    PATNO               e.g. 10874
#
# IMPORTANT: verify by running:
#   head -5 ../../results/PPMI_WGS/post_imputed/ppmi_imputed.psam
# If IDs differ, update plink_prefix/plink_suffix accordingly.
id:
  meth_visit:   1       # baseline visit number to extract (T1)
  plink_prefix: "PPMISI" # prefix in PLINK2 IDs to strip when matching PATNO
  plink_suffix: ""      # imputed psam IIDs are bare PPMISI{PATNO} — no .variant2.
                        # The pre-imputation WGS pfiles carried a .variant2 suffix,
                        # but the imputation server stripped it; leave empty here.

# ── PPMI cohort definitions ───────────────────────────────────────────────────
# COHORT column values in Participant_Status file
cohorts:
  case:    1   # Parkinson's Disease
  control: 2   # Healthy Control

# ── Datasets to run mQTLs on ──────────────────────────────────────────────────
datasets:
  ppmi_cases:
    label:  "PPMI PD Cases (baseline)"
    cohort: 1
  ppmi_controls:
    label:  "PPMI Healthy Controls (baseline)"
    cohort: 2

# ── Ancestry covariates ───────────────────────────────────────────────────────
# Number of ancestry PCs to include as mQTL covariates. The reference PCA
# eigenvalues put 90.7% of variance in PC1-4 (49.9/28.1/7.4/5.3%), PC5 at 1.4%,
# and PC6+ on a ~0.5% noise plateau — so 5 covers the elbow with one margin PC.
# Each PC costs a residual degree of freedom, which matters for the 69-sample
# control stratum (age + 5 cell types + 5 PCs = 11 covariates, leaving 56 df).
ancestry:
  n_pcs: 5

# ── Probe filtering ────────────────────────────────────────────────────────────
filters:
  min_sd:          0.02
  max_na_fraction: 0.05   # slightly more permissive than PEG given larger N

# ── MatrixEQTL settings ────────────────────────────────────────────────────────
# Thresholds matched to PEG pipeline to ensure comparable meta-analysis inputs
matrixeqtl:
  cis_dist:    1000000
  # Relaxed from 1e-5 to match PEG_MQTL. A strict per-cohort threshold drops
  # pairs before the meta-analysis can combine evidence across cohorts, which
  # shrinks the hit list feeding PPMI_LONG and the mQTL x metQTL overlap.
  # FDR correction is applied at the meta-analysis stage, not here.
  pval_cis:    1e-3
  pval_trans:  0       # trans analysis OFF — insufficient power for trans in
                       # individual cohorts; revisit with larger N.
                       # Must be exactly 0 to disable: MatrixEQTL computes
                       # every SNP x CpG pair for any non-zero threshold and
                       # only filters at write time, so 1e-20 still cost a
                       # full ~1.6e12-test scan (~15 h for the 69-sample
                       # cohort). At 0 the trans pass is skipped entirely and
                       # run_mqtl.R writes a header-only trans_mqtls.txt.
  model:       "linear"
  gzip_output: true   # write .txt.gz — smaller transfers off the cluster,
                      # and readers stream the gzip with a row cap anyway

# ── PLINK2 QC filters ─────────────────────────────────────────────────────────
plink:
  maf:   0.05   # consistent with PEG imputed genotype threshold
  geno:  0.05
  mind:  0.10
  hwe:   1e-6

# ── Compute resources ──────────────────────────────────────────────────────────
resources:
  threads_r:     1
  threads_plink: 1

