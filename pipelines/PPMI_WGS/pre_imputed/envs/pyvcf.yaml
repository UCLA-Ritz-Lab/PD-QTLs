name: pyvcf_env
# conda-forge first and no `defaults`. As of 2026-08 that channel's
# c-ares/libnghttp2 are too old for the solver to reach any libcurl new
# enough for htslib 1.19, which makes the env unsolvable on a fresh
# machine. bioconda's own recommended channel order is conda-forge,
# bioconda.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
